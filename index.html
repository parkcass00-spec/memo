<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEON CALENDAR</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <button id="prevMonth" class="nav-btn" aria-label="이전 달">&#10094;</button>
      <div class="date-selectors">
        <select id="yearSelect" class="date-select"></select>
        <span class="date-unit">년</span>
        <select id="monthSelect" class="date-select"></select>
        <span class="date-unit">월</span>
      </div>
      <button id="nextMonth" class="nav-btn" aria-label="다음 달">&#10095;</button>
      <button id="todayBtn" class="today-btn">오늘</button>
    </header>

    <section class="calendar-wrap">
      <div class="weekdays">
        <div class="weekday sun">일</div>
        <div class="weekday">월</div>
        <div class="weekday">화</div>
        <div class="weekday">수</div>
        <div class="weekday">목</div>
        <div class="weekday">금</div>
        <div class="weekday sat">토</div>
      </div>
      <div class="grid" id="calendarGrid"></div>
    </section>

    <section class="agenda-panel" id="agendaPanel">
      <div class="agenda-header">
        <h2 id="selectedDateLabel">날짜를 선택하세요</h2>
      </div>
      <form id="todoForm" class="todo-form">
        <input type="text" id="todoInput" placeholder="할 일 / 메모 추가..." autocomplete="off" disabled />
        <button type="submit" id="todoAddBtn" disabled>+</button>
      </form>
      <ul id="todoList" class="todo-list"></ul>
      <p class="todo-empty" id="todoEmpty">내용이 없습니다.</p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
