<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEON CALENDAR</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="logo">NEON<span>CAL</span></h1>
      <div class="month-nav">
        <button id="prevMonth" class="nav-btn" aria-label="이전 달">&#10094;</button>
        <div class="month-label" id="monthLabel"></div>
        <button id="nextMonth" class="nav-btn" aria-label="다음 달">&#10095;</button>
      </div>
      <button id="todayBtn" class="today-btn">오늘</button>
    </header>

    <main class="main-layout">
      <section class="calendar-wrap">
        <div class="weekdays">
          <div class="weekday sun">일</div>
          <div class="weekday">월</div>
          <div class="weekday">화</div>
          <div class="weekday">수</div>
          <div class="weekday">목</div>
          <div class="weekday">금</div>
          <div class="weekday sat">토</div>
        </div>
        <div class="grid" id="calendarGrid"></div>
      </section>

      <aside class="day-panel" id="dayPanel">
        <div class="day-panel-header">
          <h2 id="selectedDateLabel">날짜를 선택하세요</h2>
        </div>

        <div class="panel-section">
          <h3 class="section-title">✎ 메모</h3>
          <textarea id="memoInput" placeholder="이 날의 메모를 입력하세요..." disabled></textarea>
        </div>

        <div class="panel-section todo-section">
          <h3 class="section-title">☑ 할 일</h3>
          <form id="todoForm" class="todo-form">
            <input type="text" id="todoInput" placeholder="할 일 추가..." autocomplete="off" disabled />
            <button type="submit" id="todoAddBtn" disabled>+</button>
          </form>
          <ul id="todoList" class="todo-list"></ul>
          <p class="todo-empty" id="todoEmpty">할 일이 없습니다.</p>
        </div>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
